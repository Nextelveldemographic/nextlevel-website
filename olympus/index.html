<meta name="mobile-web-app-capable" content="yes">

<script>try{if(localStorage.getItem('nld_olympus_tema')!=='claro')document.documentElement.setAttribute('data-tema','oscuro')}catch(e){}</script>
<style>
/* Olympus — portada privada del equipo.
   Sistema visual NLD (versión clara por defecto, oscuro opcional con data-tema).
   El único motivo visual es el círculo azul (con número en herramientas, con ícono en áreas). */
:root{
  color-scheme:light;
  --bg:#F5F5F7;--card:#FFFFFF;--line:#E5E5EA;--line-2:#D2D2D7;
  --fg:#1D1D1F;--muted:#6E6E73;--label:#86868B;
  --blue:#0071E3;--blue-h:#0077ED;--tint:#E8F1FE;--on-blue:#FFFFFF;
  --glass:rgba(245,245,247,.82);--hover:rgba(0,0,0,.05);
  --lift:0 1px 2px rgba(0,0,0,.04),0 14px 34px rgba(0,0,0,.07);
  --ease:cubic-bezier(.28,.16,.22,1);
  --max:760px;--max-wide:1680px;--gutter:16px;
}
:root[data-tema="oscuro"]{
  color-scheme:dark;
  --bg:#000000;--card:#1C1C1E;--line:#2C2C2E;--line-2:#3A3A3C;
  --fg:#F5F5F7;--muted:#A1A1A6;--label:#86868B;
  --blue:#2997FF;--blue-h:#5AB0FF;--tint:rgba(41,151,255,.13);
  --glass:rgba(0,0,0,.72);--hover:rgba(255,255,255,.1);
  --lift:0 14px 34px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--fg);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:10px}
.wrap{width:100%;max-width:var(--max);margin-inline:auto;
  padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
@media (min-width:600px){:root{--gutter:28px}}
@media (min-width:900px){:root{--gutter:clamp(28px,3.5vw,56px)}}

/* barra */
.bar{position:sticky;top:0;z-index:10;background:var(--glass);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar-in{height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:28px;height:28px;border-radius:50%;background:#000 url(/assets/logo.png) center/cover no-repeat;flex:none}
.brand b{font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--blue)}
.acts{display:flex;align-items:center;gap:4px}
.ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:background .2s,color .2s}
.ic:hover{background:var(--hover);color:var(--fg)}
.ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic .sun{display:none}
:root[data-tema="oscuro"] .ic .sun{display:block}
:root[data-tema="oscuro"] .ic .moon{display:none}

/* encabezado */
main{flex:1}
.head{padding:40px 0 26px}
@media (min-width:600px){.head{padding:64px 0 34px}}
.eyebrow{font-size:12.5px;font-weight:700;color:var(--blue);margin-bottom:8px}
h1{font-size:clamp(30px,7.4vw,44px);line-height:1.08;font-weight:700;letter-spacing:-.025em;margin-bottom:12px}
.lead{font-size:16px;color:var(--muted);max-width:34em}
.who{margin-top:18px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--label)}
.who b{color:var(--muted);font-weight:700;text-transform:none;letter-spacing:0;font-size:12px}

/* tarjetas */
.list{display:grid;gap:14px;padding-bottom:40px}
.tool>div{display:flex;flex-direction:column;min-height:100%}
.tool .foot{margin-top:auto}
.tool p.txt{margin-bottom:16px}
.tl{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:6px}
.tl li{font-size:14px;color:var(--fg);display:flex;gap:8px;align-items:baseline}
.tl li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--blue);flex:none;transform:translateY(-2px)}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--blue);margin-bottom:18px}
.back[hidden]{display:none}
.back svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:900px){:root{--max:var(--max-wide)}.list{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:18px}.lead{max-width:44em}}
/* ancho estándar Olympus: la fila se llena sola con auto-fit */
.tool{position:relative;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;
  background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 20px 20px;
  transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s var(--ease)}
.tool:hover{transform:translateY(-2px);box-shadow:var(--lift);border-color:var(--line-2)}
.tool:active{transform:translateY(0) scale(.995)}
.num{width:34px;height:34px;border-radius:50%;background:var(--blue);color:var(--on-blue);display:grid;place-items:center;
  font-size:12.5px;font-weight:700;letter-spacing:.01em;margin-top:2px}
.tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--label);margin-bottom:6px}
.tool h2{font-size:19px;line-height:1.25;font-weight:700;letter-spacing:-.015em;margin-bottom:6px;text-wrap:balance}
.tool p{font-size:14.5px;line-height:1.5;color:var(--muted)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.meta{font-size:12px;color:var(--label)}
.open{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--blue);white-space:nowrap}
.open svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s var(--ease)}
.tool:hover .open svg{transform:translateX(3px)}
@media (min-width:600px){.tool{padding:26px 26px 22px;gap:20px}.tool h2{font-size:21px}}

.note{font-size:12px;color:var(--label);padding-top:18px;padding-bottom:max(22px,env(safe-area-inset-bottom,0px))}
.note p{border-top:1px solid var(--line);padding-top:18px;margin-top:-18px}

.num.ico{width:26px;height:26px;margin-top:3px}
.tool.area{grid-template-columns:1fr}
.tool.area .num{position:absolute;top:20px;right:20px;margin:0}
.tool.area .tag{padding-right:38px}
@media (min-width:600px){.tool.area .num{top:24px;right:24px}}
.num.ico svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* entrada sobria */
.rv{opacity:0;transform:translateY(12px);animation:rv .8s var(--ease) forwards}
@keyframes rv{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rv{animation:none;opacity:1;transform:none}.tool,.open svg{transition:none}}
</style>
</head>

<header class="bar">

    <div class="acts">

  </div>
</header>

<main class="wrap">
  <section class="head">
    <a class="back rv" id="back" href="#" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H6M11 6l-6 6 6 6"/></svg>Todas las áreas</a>
    <p class="eyebrow rv" id="eb">Herramientas internas</p>
    <h1 class="rv" style="animation-delay:.06s" id="h1">Lo que usamos en NLD, en un solo lugar.</h1>
    <p class="lead rv" style="animation-delay:.12s" id="lead">Elige un área para ver sus herramientas. Todo lo que está aquí es privado del equipo.</p>
    <p class="who rv" style="animation-delay:.18s" id="who" hidden>Sesión · <b id="who-mail"></b></p>
  </section>

  <section class="list" id="lista" aria-label="Herramientas"></section>
</main>

<footer class="wrap note"><p>Uso interno de Next Level Demographic. No compartas estos enlaces fuera del equipo.</p></footer>

  function render(){
    var id = decodeURIComponent((location.hash||'').slice(1)), a = null;
    AREAS.forEach(function(x){ if(x.id===id) a=x; });
    if (a && deArea(a.id).length) {
      back.hidden = false; eb.textContent = a.nombre; h1.textContent = a.titulo; lead.textContent = a.texto;
      lista.innerHTML = deArea(a.id).map(tarjetaTool).join('');
      document.title = a.nombre + ' · Olympus';
    } else {
      back.hidden = true; eb.textContent = 'Herramientas internas'; h1.textContent = 'Lo que usamos en NLD, en un solo lugar.';
      lead.textContent = 'Elige un área para ver sus herramientas. Todo lo que está aquí es privado del equipo.';
      lista.innerHTML = conTools.map(function(a,i){
        var ts = deArea(a.id), n = ts.length;
        return '<a class="tool area rv" style="animation-delay:'+(0.22+i*0.07).toFixed(2)+'s" href="#'+a.id+'">'+
          '<span class="num ico" aria-hidden="true">'+(ICONOS[a.id]||dos(i+1))+'</span>'+
          '<div><p class="tag">'+esc(a.nombre)+'</p><h2>'+esc(a.titulo)+'</h2><p class="txt">'+esc(a.texto)+'</p>'+
          '<div class="foot"><span class="meta">'+n+(n===1?' herramienta':' herramientas')+'</span><span class="open">Ver'+flecha+'</span></div></div></a>';
      }).join('');
      document.title = 'Olympus';
    }
    reanima();
  }
  back.addEventListener('click', function(e){ e.preventDefault(); history.pushState('', document.title, location.pathname); render(); window.scrollTo(0,0); });
  window.addEventListener('hashchange', function(){ render(); window.scrollTo(0,0); });
  window.addEventListener('popstate', render);
  render();

  // correo de la sesión (lo deja el candado al entrar)
  var m = document.cookie.match(/(?:^|;\s*)nld_tools_usuario=([^;]+)/);
  if (m) {
    try { document.getElementById('who-mail').textContent = decodeURIComponent(m[1]); document.getElementById('who').hidden = false; } catch(e){}
  }

  // tema claro / oscuro
  var root = document.documentElement, meta = document.querySelector('meta[name="theme-color"]');
  function pinta(){ var o = root.getAttribute('data-tema')==='oscuro'; meta.setAttribute('content', o ? '#000000' : '#F5F5F7');
    var b = document.getElementById('tema'); b.setAttribute('aria-label', o ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'); b.title = b.getAttribute('aria-label'); }
  document.getElementById('tema').addEventListener('click', function(){
    var o = root.getAttribute('data-tema')!=='oscuro';
    if (o) root.setAttribute('data-tema','oscuro'); else root.removeAttribute('data-tema');
    try { localStorage.setItem('nld_olympus_tema', o ? 'oscuro' : 'claro'); } catch(e){}
    pinta();
  });
  pinta();
})();
</script>
</body>
</html>
