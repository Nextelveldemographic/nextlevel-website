:root{

:root[data-theme="dark"]{--bg:#000000;--surface:#1C1C1E;--surface-2:#2C2C2E;--line:#3A3A3C;--fg:#F5F5F7;--muted:#A1A1A6;color-scheme:dark}

.poster:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}

  display:grid;place-items:center;box-shadow:0 12px 32px rgba(0,113,227,.45);transition:transform .2s ease}
.poster:hover .play{transform:scale(1.06)}
.poster .play svg{width:34px;height:34px;margin-left:4px}
.poster .eyebrow{font-size:13px;font-weight:700;color:var(--accent)}
.poster .title{font-size:30px;font-weight:700;line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
.poster .meta{font-size:14px;color:rgba(245,245,247,.78)}
.poster .eyebrow,.poster .title,.poster .meta{text-shadow:0 1px 3px rgba(0,0,0,.55)}
.controls{flex:none;display:flex;flex-direction:column;gap:8px;max-width:100%}
.bar{position:relative;height:24px;display:flex;align-items:center}
.bar input{-webkit-appearance:none;appearance:none;width:100%;height:24px;margin:0;background:transparent;cursor:pointer;position:relative;z-index:1}
.bar input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.bar input::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(var(--accent),var(--accent)) 0 0/var(--p,0%) 100% no-repeat,var(--line)}
.bar input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:var(--fg);border:0}
.bar input::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
.bar input::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
.bar input::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--fg)}
.ticks{position:absolute;inset:0;pointer-events:none;z-index:2}
.ticks i{position:absolute;top:50%;width:2px;height:4px;margin:-2px 0 0 -1px;background:var(--bg)}
.tabs{display:flex;gap:2px;padding:2px;border-radius:12px;background:var(--surface)}
.tab{flex:1;height:34px;border:0;border-radius:10px;background:transparent;color:var(--muted);font:700 13px/1 var(--font);cursor:pointer}
.tab:hover{color:var(--fg)}

.stories{display:flex;gap:6px}
.chip{flex:1;height:34px;border:0;border-radius:10px;background:var(--surface);color:var(--muted);font:700 13px/1 var(--font);letter-spacing:.08em;cursor:pointer}

.row{display:flex;align-items:center;gap:6px;min-width:0}

.btn:hover{background:var(--surface)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn svg{width:20px;height:20px}
.btn[hidden]{display:none}
.time{flex:none;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chap{flex:1;min-width:0;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{flex:none;display:flex;gap:2px;padding:2px;border-radius:12px;background:var(--surface)}

.social .av i{position:absolute;left:50%;bottom:calc(var(--u)*-2);transform:translateX(-50%);width:calc(var(--u)*4.2);height:calc(var(--u)*4.2);border-radius:50%;background:#FE2C55;color:#fff;font-style:normal;font-size:calc(var(--u)*3.4);line-height:calc(var(--u)*4.1);text-align:center}
.social .disc{width:calc(var(--u)*9);height:calc(var(--u)*9);border-radius:50%;background:#1D1D1F center/58% no-repeat;border:calc(var(--u)*1.6) solid #2C2C2E}
.social .sq{width:calc(var(--u)*7.5);height:calc(var(--u)*7.5);border-radius:calc(var(--u)*1.6);border:2px solid #FFFFFF;background:#000 center/86% no-repeat}

.cineX.fade{opacity:0}
.cineX:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

body.cine{padding-left:0;padding-right:0;background:#000}

body.cine .app{background:#000}
body.cine .app{padding-block:0;gap:0}

function snow(c,E,t,n,sp,box){
  const W=box?box[2]:E.W, X=box?box[0]:-E.W/2, Y=box?box[1]:0, HH=box?box[3]:1000;
  const N=Math.round(n*W/562);
  c.fillStyle='#FFFFFF';
  for(let i=0;i<N;i++){
    const x=X+(((H(i)*(W+40)+Math.sin(t*0.8+i)*18)%(W+40))+(W+40))%(W+40)-20;
    const y=Y+((H(i+50)*(HH+100)+t*sp*(0.6+H(i+9)*0.8))%(HH+100))-50;
    c.globalAlpha=0.45+H(i+4)*0.5;c.beginPath();c.arc(x,y,1.6+H(i+3)*3.2,0,TAU);c.fill();
  }
  c.globalAlpha=1;
}
function frost(c,E,a){
  if(a<=0)return;const R=Math.max(E.W,1000)*0.78;
  const g=c.createRadialGradient(0,500,R*0.42,0,500,R*1.05);
  g.addColorStop(0,'rgba(222,232,241,0)');g.addColorStop(1,'rgba(222,232,241,'+(0.55*a)+')');
  c.fillStyle=g;c.fillRect(-E.W/2,0,E.W,1000);
}

function clock(c,x,y,r,h,m,face,rim){
  circ(c,x,y,r+5,rim||'#4A525A');circ(c,x,y,r,face||'#DDE1E4');
  c.fillStyle=rim||'#4A525A';for(let k=0;k<12;k++){const a=k/12*TAU;circ(c,x+Math.sin(a)*r*0.8,y-Math.cos(a)*r*0.8,k%3?1.6:3,rim||'#4A525A');}
  const ha=((h%12)+m/60)/12*TAU, ma=m/60*TAU;
  line(c,x,y,x+Math.sin(ha)*r*0.5,y-Math.cos(ha)*r*0.5,5,'#2F353B');
  line(c,x,y,x+Math.sin(ma)*r*0.75,y-Math.cos(ma)*r*0.75,3.5,'#2F353B');
  circ(c,x,y,4,'#2F353B');
}

function caption(c,E,t,a,b,lines,dot){

function bubPath(c,w,h,speech,dy,tail){
  c.beginPath();const r=speech?Math.min(30,h/2):h/2;rrectSub(c,-w/2,-h/2+dy,w,h,r);
  if(speech){
    const tx=tail[0],ty=tail[1];const bx=clamp(tx*0.4-17,-w/2+r,w/2-r-34);
    const tipX=bx+17+clamp((tx-(bx+17))*0.45,-70,70),tipY=h/2+clamp((ty-h/2)*0.5,22,64);
    c.moveTo(bx,h/2-10+dy);c.lineTo(bx+34,h/2-10+dy);c.lineTo(tipX,tipY+dy);c.closePath();
  }else{
    const step=Math.max(34,h*0.36),rb=Math.min(h*0.3,30);
    for(let x=-w/2+r*0.7;x<=w/2-r*0.7+1;x+=step){arcSub(c,x,-h/2+6+dy,rb);arcSub(c,x+step/2,h/2-6+dy,rb*0.9);}

function bubble(c,E,t,o){

const clk={from:0,perf:0,waiting:false,wStart:0};let snd=null,sndOK=false,sid='dc';const SNDS={};
/* La narración de cada historia vive en /olympus/jubilacion-audio/<id>.m4a y se pide solo al elegirla.
   Antes las 12 iban dentro de esta página en base64: 12 MB que se bajaban enteros en cada visita. */
const SND_IDS=["s-dc", "s-md", "s-tx", "s-ca", "e-dc", "e-md", "e-tx", "e-ca", "e-dc2", "e-md2", "e-tx2", "e-ca2"];
function loadSnd(id){if(SNDS[id]!==undefined)return SNDS[id];let a=null;
  if(SND_IDS.indexOf(id)>=0){try{
    a=new Audio();a.preload='auto';a.src='/olympus/jubilacion-audio/'+id+'.m4a';a._ok=true;
    a.addEventListener('playing',()=>{if(snd===a&&clk.waiting){clk.waiting=false;clk.from=a.currentTime;clk.perf=performance.now();}});
    a.addEventListener('error',()=>{a._ok=false;if(snd===a){sndOK=false;clk.waiting=false;}});}catch(e){a=null;}}
  SNDS[id]=a;return a;}
function now(){if(clk.waiting)return clk.from;return clk.from+(performance.now()-clk.perf)/1000;}
function play(from){clk.from=from;clk.perf=performance.now();clk.waiting=false;
  if(snd&&sndOK){snd.muted=muted;try{snd.currentTime=from;}catch(e){}clk.waiting=true;clk.wStart=performance.now();
    try{const pr=snd.play();if(pr&&pr.catch)pr.catch(()=>{clk.waiting=false;clk.perf=performance.now();});}catch(e){clk.waiting=false;}}
  playing=true;ended=false;started=true;poster.hidden=true;setPP();
  cancelAnimationFrame(raf);const step=()=>{if(!playing)return;
    if(clk.waiting&&performance.now()-clk.wStart>(snd&&sndOK&&snd.readyState<3?8000:900)){clk.waiting=false;clk.perf=performance.now();}
    let t=now();
    if(!clk.waiting&&snd&&sndOK&&!snd.paused&&!snd.seeking&&snd.readyState>=2){const ta=snd.currentTime;if(Math.abs(ta-t)>0.25){clk.from=ta;clk.perf=performance.now();t=ta;}}
    if(t>=DUR){t=DUR;tCur=t;draw(t);ui(t);finish();return;}tCur=t;draw(t);ui(t);
    if(clk.waiting&&performance.now()-clk.wStart>350)$('chap').textContent='Cargando sonido…';
    raf=requestAnimationFrame(step);};
  raf=requestAnimationFrame(step);}
function pause(){if(!playing)return;tCur=clamp(now(),0,DUR);playing=false;cancelAnimationFrame(raf);if(snd)snd.pause();setPP();draw(tCur);ui(tCur);}
function finish(){playing=false;ended=true;cancelAnimationFrame(raf);if(snd)snd.pause();setPP();
  $('pMeta').textContent='Ver de nuevo · '+mmss(DUR);poster.setAttribute('aria-label','Ver de nuevo');poster.hidden=false;}
function toggle(){if(playing)pause();else play(ended?0:tCur);}
function setPP(){const b=$('pp');b.innerHTML=playing?IC.pause:(ended?IC.replay:IC.play);b.setAttribute('aria-label',playing?'Pausar':(ended?'Ver de nuevo':'Reproducir'));}
function setMute(m){muted=m;if(snd)snd.muted=m;const b=$('mute');b.innerHTML=m?IC.mute:IC.vol;b.setAttribute('aria-pressed',m?'true':'false');b.setAttribute('aria-label',m?'Activar sonido':'Silenciar');}
const mmss=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function ui(t){seek.value=t.toFixed(2);seek.style.setProperty('--p',(t/DUR*100)+'%');$('time').textContent=mmss(t)+' / '+mmss(DUR);$('chap').textContent=(social==='tt'?'TikTok · ':social==='ig'?'Reels · ':'')+SC[sceneAt(t)].name;}
function draw(t){renderTo(cx,cv.width,cv.height,t);}
function layout(){
  const cine=document.body.classList.contains('cine'),aw=app.clientWidth,ah=cine?app.clientHeight:app.clientHeight-28-ctrls.offsetHeight-14,ar=fmt==='v'?9/16:16/9;
  let w=Math.min(aw,Math.max(120,ah)*ar);w=Math.floor(w);const h=Math.floor(w/ar);
  stage.style.width=w+'px';stage.style.height=h+'px';stage.style.setProperty('--u',(w/100)+'px');ctrls.style.width=Math.min(aw,Math.max(w,330))+'px';
  const dpr=Math.min(window.devicePixelRatio||1,2);cv.width=Math.max(2,Math.round(w*dpr));cv.height=Math.max(2,Math.round(h*dpr));
  $('fV').setAttribute('aria-pressed',fmt==='v'&&!social?'true':'false');$('fS').setAttribute('aria-pressed',social?'true':'false');$('fS').setAttribute('aria-label',social==='tt'?'Vista en redes: TikTok (tocá para Reels)':social==='ig'?'Vista en redes: Reels (tocá para quitar)':'Vista en redes sociales');$('fH').setAttribute('aria-pressed',fmt==='h'?'true':'false');
}
function posterT(){return started?tCur:ST.posterT;}

let curTab='s';const lastByTab={s:'s-dc',e:'e-dc'};
function renderChips(tab){curTab=tab;const box=$('stories');box.innerHTML='';
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab?'true':'false'));
  TABORDER[tab].forEach(k=>{const id=tab+'-'+k,it=CAT[id],b=document.createElement('button');b.type='button';b.className='chip';b.dataset.id=id;b.textContent=it.chip;
    const nm=it.kind==='ep'?'Episodio '+it.epN+' · '+it.label:it.label;b.title=nm;b.setAttribute('aria-label',nm);b.setAttribute('aria-pressed',id===sid?'true':'false');
    b.addEventListener('click',()=>setStory(id));box.appendChild(b);});}
function setStory(id){if(!CAT[id])id='s-dc';if(playing)pause();sid=id;ST=CAT[id];lastByTab[ST.tab]=id;buildSC();buildCues();
  if(snd)snd.pause();snd=loadSnd(id);sndOK=!!(snd&&snd._ok);
  seek.max=DUR;tCur=0;started=false;ended=false;poster.hidden=false;poster.setAttribute('aria-label','Reproducir con sonido');
  if(ST.kind==='ep'){$('pEy').textContent='El después · Episodio '+ST.epN+' · '+ST.label;$('pTitle').textContent=ST.epTitle;}
  else{$('pEy').textContent=ST.label;$('pTitle').textContent='¿Será verdad?';}
  $('pMeta').textContent=mmss(DUR)+' · subí el volumen y tocá para verlo';
  renderChips(ST.tab);buildTicks();renderSocial();
  try{localStorage.setItem('nld-sv-item',id);}catch(e){}setPP();redraw();ui(0);}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{const tb=b.dataset.tab;if(tb!==curTab)setStory(lastByTab[tb]);}));
poster.addEventListener('click',()=>play(ended||!started?0:tCur));
$('pp').addEventListener('click',()=>{if(!started){play(0);return;}toggle();});
$('mute').addEventListener('click',()=>setMute(!muted));
$('fV').addEventListener('click',()=>{social='';setFmt('v');});$('fH').addEventListener('click',()=>{social='';setFmt('h');});$('fS').addEventListener('click',()=>{social=social===''?'tt':social==='tt'?'ig':'';setFmt('v');});

  const em='url('+EMBLEM.src+')',ico=(x,y,svg,lab)=>'<div class="ico" style="left:'+x+'%;top:'+y+'%">'+svg+(lab?'<span>'+lab+'</span>':'')+'</div>';

let cineT=0;
function cineShowX(){const x=$('cineX');x.classList.remove('fade');clearTimeout(cineT);cineT=setTimeout(()=>x.classList.add('fade'),2600);}
function isNativeFS(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
function setCine(on){document.body.classList.toggle('cine',on);$('cineX').hidden=!on;if(on)cineShowX();
  if(!on&&isNativeFS()){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document);}catch(e){}}
  redraw();}
$('fs').addEventListener('click',()=>{setCine(true);try{const fn=app.requestFullscreen||app.webkitRequestFullscreen;if(fn&&(document.fullscreenEnabled||document.webkitFullscreenEnabled)){const r=fn.call(app);if(r&&r.catch)r.catch(()=>{});}}catch(e){}});
$('cineX').addEventListener('click',e=>{e.stopPropagation();setCine(false);});
const onFS=()=>{if(!isNativeFS()&&document.body.classList.contains('cine'))setCine(false);else redraw();};
document.addEventListener('fullscreenchange',onFS);document.addEventListener('webkitfullscreenchange',onFS);
stage.addEventListener('click',e=>{if(!document.body.classList.contains('cine'))return;if(e.target.closest('#poster'))return;cineShowX();if(started)toggle();});
let wasPlaying=false,scrubbing=false;
const scrubStart=()=>{if(scrubbing)return;scrubbing=true;wasPlaying=playing;if(playing)pause();};
const scrubEnd=()=>{if(!scrubbing)return;scrubbing=false;if(wasPlaying)play(tCur);};
seek.addEventListener('pointerdown',scrubStart);seek.addEventListener('touchstart',scrubStart,{passive:true});
seek.addEventListener('input',()=>{if(!scrubbing&&playing){wasPlaying=true;scrubbing=true;pause();}tCur=parseFloat(seek.value);started=true;ended=false;poster.hidden=true;setPP();draw(tCur);ui(tCur);});
seek.addEventListener('change',scrubEnd);seek.addEventListener('pointerup',scrubEnd);seek.addEventListener('touchend',scrubEnd);
document.addEventListener('keydown',e=>{if(e.target===seek&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))return;
  if(e.key===' '||e.key==='k'){e.preventDefault();if(!started)play(0);else toggle();}
  else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const t=clamp((playing?now():tCur)+(e.key==='ArrowRight'?5:-5),0,DUR);started=true;poster.hidden=true;if(playing)play(t);else{tCur=t;draw(t);ui(t);}}
  else if(e.key==='m')setMute(!muted);
  else if(e.key==='f')setCine(!document.body.classList.contains('cine'));
  else if(e.key==='Escape'&&document.body.classList.contains('cine'))setCine(false);});
window.addEventListener('resize',()=>redraw());
setMute(false);
{let st0='s-dc';try{st0=localStorage.getItem('nld-sv-item')||'s-dc';}catch(e){}let h=(location.hash||'').slice(1);if(CAT['s-'+h])h='s-'+h;if(CAT[h])st0=h;setStory(st0);}

  frame(t,w,h,q){if(!this._c)this._c=document.createElement('canvas');const c=this._c;if(c.width!==w)c.width=w;if(c.height!==h)c.height=h;
    renderTo(c.getContext('2d'),w,h,t);return c.toDataURL('image/jpeg',q||0.92);},
  async audio(){const sr=44100,oc=new OfflineAudioContext(2,Math.ceil(sr*DUR),sr),o=mkOut(oc),S=new Sess(oc,o.comp,0,0);S.pump(1e9);const b=await oc.startRendering();return wavB64(b);}};
})();
